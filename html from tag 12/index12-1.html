<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>html form tag</title>
    </head>
    <body>
        <!-- <p>name holo inportance tag detabes baken a install hoy</p> -->
         <!-- <p>required & autocomplete dewar karone khali ghore ki lekte hobe tai dekhay</p> -->
          <!-- <p>value attribute dewar karone user ja fill kore aita value te add hoy</p> -->
           <!-- <p>readonly mane email ti kew change korte parbe na</p> -->
            <!-- <p>abar ai email ta jodi na chai tahale diseble likle hobe</p> -->
             <!-- <p>email fill korar jonno pattern bebohar kora hoy</p> -->
        <form action="#">
            <label for="email">enter your email</label>
            <input type="email" placeholder="enter your email" name="email"
            required
            autocomplete="off"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,$}"
            size="20"
            value="thapa@thach.com"
            readonly
            disabled>
            <br>
            <input type="submit" value="login">
            <!-- <p>div hoho akti block tag samp tag holo ak line a dekhabe div er jaygay samp bosale poriborton dekhabe</p> -->
            <div>
                <h1>Welcome to <samp style="color: brown;"> our webside</samp></h1>
                <p>this is a discription of our service</p>
            </div>
        </form>
    </body>

</html>
