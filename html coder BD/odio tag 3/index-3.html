<!DOCTYPE html>
<html>
    <head>
        <title>HTML Audio Tag</title>
    </head>
    <body>
       <audio src="hindi song.mp3" controls></audio>  
       <audio src="hindi song 1.mp3" controls autoplay></audio>
       <hr>
       
       <audio controls muted>
           <source src="hindi song 1.mp3">
       </audio>
    </body>
</html>
