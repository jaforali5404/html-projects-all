<!DOCTYPE html>
<html>
    <head>
        <title>html marquee tag</title>
    </head>
    <body>
        <marquee direction="right" behavior="slide" height="150" width="200" bgcolor="#dadada">i love html</marquee>
        <hr>
        <marquee direction="down" behavior="alternate" height="150" width="200" bgcolor="#dadada">
            <marquee behavior="alternate" direction="">i love html</marquee>
        </marquee>
        <hr>
        <marquee direction="up" height="150" width="200" bgcolor="#dadada">i love html</marquee>
        <hr>
        <marquee direction="left" height="150" width="200" bgcolor="#dadada">i love html</marquee>
    </body>
</html>
