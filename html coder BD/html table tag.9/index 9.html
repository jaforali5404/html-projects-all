<!DOCTYPE html>
<html>
    <head>
        <title>html tale tag</title>
    </head>
    <body>
       <table border="1" width="25%" height="200">
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>PHONE NO</th>
            </tr>
            <tr>
                <td>1</td>
                <td>rohim</td>
                <td>01777777</td>
            </tr>
            <tr>
                <td>2</td>
                <td>korim</td>
                <td>1999999</td>
            </tr>

       </table>

       <hr>
       <table border="1" width="25%" height="200">
            <tr>
                <th>name</th>
                <th>phone no</th>
                <th rowspan="3">note</th>
            </tr>
            <tr>
                <td rowspan="2">rohim</td>
                <td>01777777</td>
            </tr>
            <tr>
                <td>0188888</td>
            </tr>


       </table>

       <hr>
       <table border="1" width="25%" height="200">
           <tr>
              <th>name</th>
              <td colspan="2">rohim</td>
           </tr>
           <tr>
              <th>phone no</th>
              <td>0177777</td>
              <td>0188888</td>
           </tr>
           <tr>
              <td colspan="3">note</td>
           </tr>
       </table>


    </body>
</html>
