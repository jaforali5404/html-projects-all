<!DOCTYPE html>
<html>
    <head>
        <title>html sup and sub tag</title>
    </head>
    <body>
        a<sup>2</sup>+2ab+b<sup>2</sup>
        <hr>
        H<sub>2</sub>O
        <hr>


    <p>1. a<sup>2</sup></p>
    <p>2. x<sup>3</sup></p>
    <p>3. (a+b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></p>
    <p>4. (a-b)<sup>2</sup> = a<sup>2</sup> - 2ab + b<sup>2</sup></p>
    <p>5. a<sup>2</sup> - b<sup>2</sup> = (a+b)(a-b)</p>

    <hr>

    <h2>Sub Tag (নিচের সূচক)</h2>

    <p>6. H<sub>2</sub>O</p>
    <p>7. CO<sub>2</sub></p>
    <p>8. O<sub>2</sub></p>
    <p>9. x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub></p>
    <p>10. a<sub>1</sub> + a<sub>2</sub> + a<sub>3</sub></p>

    </body>
</html>
